    that would need one must be skipped with an explicit reason — never faked
    into passing.
- id: "5"
  title: Clipboard and panel visibility adapters
  description: >-
    Implement SystemClipboard and WindowManagerPanelVisibility behind their
    existing domain ports, so CAP-2's pre-fill, CAP-11's copy, and CAP-14's
    toggle and focus-loss hide have real backing.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-8 (panel visibility is SYNCHRONOUS in-process
    state and the hotkey toggle reads it without awaiting; the port exposes
    isVisible as a synchronous field kept current by the adapter from window
    events including the focus-loss hide; show() only changes visibility on an
    already-constructed window and nothing on the show path allocates, loads, or
    awaits IO — CAP-1's 100 ms budget depends on this), AD-18 (every show()
    starts a fresh panel session, re-seeded from the CURRENT clipboard), AD-1
    (window_manager and any clipboard plugin stay in infrastructure; the domain
    ports at lib/src/domain/panel/panel_visibility.dart and
    lib/src/domain/clipboard/clipboard_port.dart are unchanged except as the
    ledger item below requires).

    Deferred-work items this story closes (from
    _bmad-output/implementation-artifacts/deferred-work.md — retain each heading;
    when resolved, set `status: done <date>` and add a `resolution:` citing evidence):

    1. source_spec spec-application-layer-controllers.md — "The window_manager
    PanelVisibility adapter must flip its isVisible mirror synchronously inside
    show()/hide(), not only from window events, or a fast double hotkey press
    shows twice and never hides." This is the single most important line in this
    story. Set the mirror inside show() and hide() BEFORE awaiting anything, and
    reconcile it from window events afterwards. The ledger also requires the
    test to model the lag: FakePanelVisibility flips synchronously, so a
    lag-modelling fake or adapter test is the only thing that can catch this —
    write a test that drives two toggle presses faster than a simulated window
    event round trip and asserts the panel ends hidden.

    2. source_spec spec-application-layer-controllers.md — "PanelVisibility.
    changes does not declare whether it is broadcast, but the panel widget and
    the correction controller will both need it — a single-subscription adapter
    would throw at startup." ConfigStore.changes already documents itself as
    broadcast; do the same for PanelVisibility.changes — a doc edit on the
    domain port plus a broadcast implementation in the adapter plus a test that
    attaches two listeners. This is a domain edit that the controller spec
    gated on a human; the human approved it as part of this story's breakdown,
    so proceed.

    This container has no keybinder-3.0, no xdg-desktop-portal and no compositor
    — write the code, mark tests that need a real desktop as skipped with an
    explicit reason, and never fake a passing test.
