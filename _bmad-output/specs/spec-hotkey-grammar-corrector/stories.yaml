- id: "8"
  title: Wayland portal global hotkey adapter
  description: >-
    Implement WaylandPortalGlobalHotkey over dbus and the XDG GlobalShortcuts
    portal, in AD-11's exact call order, with AD-12's visible degradation on
    compositors that ship no portal backend.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-11 (the portal call ORDER is itself an
    invariant — perform exactly this sequence on the session bus, in this order:
    (1) org.freedesktop.host.portal.Registry.Register(
    "com.divertedriver.HotkeyGrammarCorrector") on
    /org/freedesktop/host/portal/registry, ONCE, before any other portal call,
    tolerating UnknownMethod / ServiceUnknown because portal < 1.20 has no
    Registry; (2) org.freedesktop.portal.GlobalShortcuts.CreateSession on
    /org/freedesktop/portal/desktop passing handle_token and
    session_handle_token, awaiting the Response signal on the returned Request
    path; (3) BindShortcuts(session, [("toggle-panel", {description,
    preferred_trigger})], parent_window: "", options), awaiting Response and
    reading the bound shortcuts BACK; (4) subscribe to Activated —
    (o session_handle, s shortcut_id, t timestamp, a{sv} options) — filtering on
    session handle and shortcut_id == "toggle-panel", and subscribe to
    ShortcutsChanged), AD-10 (bind() returns the EFFECTIVE binding read back
    from the portal with BindingAuthority.compositor; preferred_trigger is a
    hint only — the compositor and user choose the combination and the portal
    shows its own dialog; effective is null when the backend cannot report it),
    AD-12 (a failed CreateSession or BindShortcuts resolves to
    HotkeyUnavailable, NEVER an exception; wlroots compositors — Sway, Hyprland,
    Niri — ship no GlobalShortcuts backend, only GNOME and KDE do, verified
    2026-08-06 against community tracking rather than an upstream matrix), AD-9
    (same single port; this adapter serializes HotkeyBinding to the XDG trigger
    syntax — `CTRL+SHIFT+g` — and that syntax never appears above
    infrastructure), AD-1 (dbus stays inside
    lib/src/infrastructure/hotkey/wayland_portal_global_hotkey.dart).

    This story closes no deferred-work item.

    Two things that will silently break this if missed: the app id must be
    reverse-DNS AND have an installed .desktop file of the same basename —
    GNOME discards the bind otherwise. Story 11 ships that file; until it does,
    this adapter's live path cannot work on a real GNOME session, which is
    expected, not a bug in this story. Second, the spine's Deferred section
    notes a sandboxed (Flatpak) app must NOT call Registry.Register — packaging
    format is undecided, so implement the non-sandboxed path and leave a clearly
    marked seam.

    This container has no keybinder-3.0, no xdg-desktop-portal and no compositor
    — write the code, mark tests that need a real desktop as skipped with an
    explicit reason, and never fake a passing test. The call ORDER is testable
    without a portal: drive the adapter against a fake D-Bus client and assert
    the exact sequence, the Registry tolerance of UnknownMethod /
    ServiceUnknown, the read-back of effective bindings, and the
    HotkeyUnavailable degradation. Those tests must not be skipped.
- id: "9"
  title: Correction panel UI
  description: >-
    Build the panel widgets: the original text alongside three labeled register
    variants, streaming partials, 1/2/3 selection, per-suggestion copy buttons,
    and the inline error with Retry. Delivers CAP-2, CAP-3, CAP-4, CAP-5,
    CAP-10, CAP-11, CAP-13 and CAP-14's UI half over the existing
    CorrectionController.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-6 (SuggestionRegister.values.indexOf(r) + 1 is
    BOTH the selecting key 1/2/3 and the panel's top-to-bottom order — formal,
    casual, shorter; do not hardcode either), AD-18 (every show() starts a fresh
    panel session re-seeded from the current clipboard with previous
    suggestions, error and edits cleared; Retry replays the string CAPTURED at
    submit, not whatever the editor holds at retry time; the panel stays open
    after a copy and every variant remains copyable; copying is NEVER implicit
    in selection — 1/2/3 only highlights), AD-3 (CorrectionCompleted is
    authoritative and REPLACES whatever the UI accumulated from deltas; deltas
    are a progressive-rendering optimisation, never the record of truth, and
    textDelta is an incremental fragment the UI concatenates per register —
    deltas may arrive for registers in any order and interleaved), AD-2 (the
    event and value types are fixed verbatim; the panel reads them, it does not
    reshape them), AD-4 (hiding the panel does NOT cancel an in-flight
    correction — it runs to its terminal event and is persisted; only Retry, a
    new correction, and shutdown cancel), AD-1 (ui imports application and
    read-only domain types, never infrastructure), and the Consistency
    Conventions "State mutation" row (immutable state with copyWith; a single
    controller per surface owns state; widgets never mutate state outside their
    own ephemeral UI concerns).

    CAP-13 is specific: the error is shown INLINE in the panel — not a toast,
    not a separate window — replacing the empty or half-streamed suggestion,
    with a Retry action.

    CAP-10 is specific: the original and at least one variant must be readable
    at the same time WITHOUT scrolling one out of view.

    This story closes no deferred-work item, but it carries one follow-through
    from story 3: the empty-submit guard lives in the controller as the
    invariant; add a disabled Correct action here as the UI affordance on top of
    it, not instead of it.

    The spine's Deferred section leaves panel visual design, spacing and
    keyboard-focus order to this story — the widgets own it. It also leaves the
    shipped preset's concrete prompt wording out of scope (SPEC puts
    output-quality tuning out of scope), so do not tune prompts here.

    This container has no keybinder-3.0, no xdg-desktop-portal and no compositor
    — write the code, mark tests that need a real desktop as skipped with an
    explicit reason, and never fake a passing test. Flutter widget tests run
    headless and must cover the streaming render, the delta-then-authoritative-
    completed replacement, 1/2/3 selection, per-suggestion copy, and the inline
    error plus Retry replaying the captured text. Cite the CAP id in each test
    name.
