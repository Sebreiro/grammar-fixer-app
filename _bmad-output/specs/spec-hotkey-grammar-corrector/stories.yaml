    root is what resolves the active pair — the settings UI must not select a
    provider itself), AD-12 (when hotkeys are unavailable on this compositor the
    settings screen states it, alongside the tray), AD-1 (ui imports application
    and read-only domain types only).

    The SPEC's Ratified Divergence section is the behaviour contract for this
    screen: in-app settings are AUTHORITATIVE on X11 and ADVISORY on Wayland,
    and the screen shows which regime is active alongside the effective
    combination. Do not present the hotkey as app-owned on both display servers.

    This story closes no deferred-work item. It is the consumer that motivated
    HotkeyBinding value equality — that equality was added in story 4, so
    compare bindings with == here rather than re-adding it.

