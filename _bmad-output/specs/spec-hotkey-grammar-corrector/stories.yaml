    from settings takes effect without restarting the daemon.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-9 (the GlobalHotkey port in
    lib/src/domain/hotkey/global_hotkey.dart is the ONLY hotkey surface anything
