    3. source_spec spec-application-layer-controllers.md — "CorrectionState and
    SettingsState compare by identity, so no consumer can dedupe the state
    emitted per keystroke and per streamed delta." Add value equality to both.
    The same entry also says: revisit AppConfig's identical() echo suppression
    in SettingsController, because ConfigStore.changes promises no instance
    identity — with AppConfig value equality now in place, switch that check to
    == and test that a re-read config carrying identical values does not
    re-trigger the echo path.

    4. source_spec spec-claude-agent-sdk-provider.md — "AppConfig.sidecarPath /
    interpreterPath and the registry's ProviderConfig.settings keys are two
    unbridged homes for the same AD-19 paths — the composition-root slice must
    wire one to the other (and pin it with a test) or delete one." Decide and
    execute: either map AppConfig's first-class fields into the settings map the
    registry reads, or delete the duplicate home. Pin the outcome with a test
    that fails if the two drift apart again. State which way you went and why.

    Verification here is a headless widget/unit test over the provider graph
