- id: "3"
  title: Controller failure contract
  description: >-
    Close the unmodelled port-failure contract the three application
    controllers currently leak as unhandled async errors, now that real file and
    database IO can throw. Also settles two contract decisions the controller
    spec left open: the register-set check on CorrectionCompleted and the
    empty-submit guard.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-3 (exactly one terminal event; a provider never
    throws across the boundary; CorrectionCompleted.suggestions always has one
    entry per SuggestionRegister value), AD-12 (a failed hotkey registration
    resolves to a HotkeyUnavailable state, never an exception — this is the
    state the ledger notes AD-12 names but the domain does not yet declare),
    AD-13 (a malformed or unwritable config never fails startup for a resident
    daemon — it surfaces a warning), AD-15 (each adapter owns its failure
    translation; a vendor error type never escapes a port boundary), and the
    Consistency Conventions "Errors" row (expected failures are modelled values;
    exceptions signal programmer error only). This story adds domain types, so
    keep AD-1 green.

    Deferred-work items this story closes (from
    _bmad-output/implementation-artifacts/deferred-work.md — retain each heading;
    when resolved, set `status: done <date>` and add a `resolution:` citing evidence):

    1. source_spec spec-application-layer-controllers.md — "Port failures are
    unmodelled across all three controllers — a rejected
    CorrectionRepository.save, a throwing ClipboardPort.readText, a rejected
    ConfigStore.write, and a throwing GlobalHotkey.bind each become an unhandled
    async error or an unrendered exception in a daemon that must stay resident."
    The ledger names the shape of the fix: inject the Logger port into the
    controllers, add a failure field to SettingsState, and declare the
    HotkeyUnavailable state AD-12 names. Cover all four named paths plus any
    other await on a port inside the controllers. A resident daemon must survive
    every one of them. The controller spec's I/O matrix says "N/A" under Error
    Handling for 11 of 13 rows — fill in all of them, and state in the story's
    completion notes what each row now does.

    2. source_spec spec-application-layer-controllers.md — "A
    CorrectionCompleted carrying missing or duplicated registers is accepted and
    written to history as a successful correction that produced nothing." AD-3
    guarantees one Suggestion per SuggestionRegister value and the controller
    already defends the other AD-3 breach (a second terminal event). Defend this
    one the same way. The open contract decision is which
    CorrectionFailureKind a register mismatch maps to — AD-15 puts failure
    translation in the adapter, so decide deliberately between translating in
    the adapter and treating a controller-side mismatch as malformedResponse,
    write the decision into the code as a documented contract, and say which you
    chose and why in the completion notes.

    3. source_spec spec-application-layer-controllers.md — "Nothing stops
    submitting an empty editor — it spawns a sidecar process and writes a CAP-7
    history row with empty input_text." The ledger notes the guard could live in
    the controller or in a disabled Correct action in the panel UI. Put it in
    the CONTROLLER so it holds for every caller, and note in the completion
    notes that the panel UI story should additionally disable the action — a UI
    affordance on top of the invariant, not instead of it.

    All of this is headless-verifiable with the existing test/fakes/ — extend
    the fakes so each can be told to throw or reject on demand. No real desktop
    needed.
- id: "4"
  title: Composition root and Riverpod wiring
  description: >-
    Stand up main.dart and application/composition/ so the domain, controllers
    and adapters built so far actually run as one daemon: ProviderScope, the
    Riverpod provider graph, display-server adapter selection, and a window that
    starts hidden.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-5 (main.dart reads AppConfig and resolves the
    single active (CorrectionProvider, Preset) pair and injects it; nothing
    below the composition root selects a provider or accepts a model id without
    its prompt), AD-17 (Riverpod lives in application and ui only; the providers
    in application/composition/ ARE the composition root, and main.dart only
    installs the ProviderScope and the overrides for the selected platform
    adapters; domain types take their ports through constructors and never
    import Riverpod), AD-8 (the window is constructed once at startup and
    hidden; nothing on the show path allocates, loads, or awaits IO), AD-15
    (provider selection is a Map<String, CorrectionProvider
    Function(ProviderConfig)> lookup, never a switch in the pipeline — the
    registry already exists at
    lib/src/infrastructure/correction/provider_registry.dart), AD-9 (the
    composition root reads XDG_SESSION_TYPE, falling back to the presence of
    WAYLAND_DISPLAY, constructs exactly ONE hotkey adapter, and never switches
    at runtime — stub the two adapters behind the port for now; stories 7 and 8
    implement them), AD-19 (interpreter and sidecar paths come from config),
    AD-14 (the singleton lock from story 1 is acquired here, at startup).

    Deferred-work items this story closes (from
    _bmad-output/implementation-artifacts/deferred-work.md — retain each heading;
    when resolved, set `status: done <date>` and add a `resolution:` citing evidence):

    1. source_spec spec-bootstrap-domain-ring.md — "The generated linux/ runner
    shows a 1280x720 window on launch — the composition-root slice must replace
    this with the pre-created hidden window the SPEC mandates (panel is shown
    only by the hotkey toggle, AD-8)." Edit linux/runner/my_application.cc so
    the window is not shown on first frame, and pair it with window_manager
    setup so the panel is constructed and hidden at startup. Launching the
    daemon must leave NO visible window.

    2. source_spec spec-bootstrap-domain-ring.md — "Domain value types
    (AppConfig, ProviderConfig, CorrectionRecord, HotkeyBinding) compare by
    identity — add value equality when a consumer needs it (HotkeyBinding is
    AD-2/AD-9 verbatim, so its equality needs a spine renegotiation)." Riverpod
    select and Stream.distinct are the consumers, and they arrive here. Add
    value equality to AppConfig, ProviderConfig and CorrectionRecord. For
    HotkeyBinding: the spine fixes its declaration verbatim, and adding
    operator== / hashCode is an addition rather than a change to the declared
    fields — do it, and record in the completion notes that AD-9's code block
    now has members the spine does not show, so the spine needs a currency
