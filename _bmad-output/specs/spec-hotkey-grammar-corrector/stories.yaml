- id: "1"
  title: Config store, app paths, and system ports
  description: >-
    Build the config and system foundations the daemon needs before anything
    can be wired: AppPaths, JsonConfigStore, SystemClock, StderrLogger, and
    SingleInstanceLock. Serves CAP-8 and CAP-12's config half and AD-13's
    single-owner rule; no UI and no composition root in this story.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    ADs that bind this story: AD-13 (config has exactly one owner; every
    settings mutation goes through ConfigStore; nothing else opens the config
    file; a malformed file yields defaults plus a surfaced warning, never a
    failed startup), AD-14 (the daemon is a singleton — acquire an
    abstract-namespace socket or lock file under $XDG_RUNTIME_DIR at startup;
    if held, signal the running instance to show its panel and exit 0), AD-1
    (dependency direction — these are infrastructure adapters behind the
    domain ports that already exist in lib/src/domain/config/config_store.dart,
    lib/src/domain/clock.dart and lib/src/domain/logger.dart; do not add
    imports to domain), AD-19 (interpreter path and sidecar path are config
    values, not compiled-in constants), and the spine's Consistency
    Conventions rows for "Config & data paths" (config at
    ${XDG_CONFIG_HOME:-~/.config}/hotkey-grammar-corrector/config.json, data at
    ${XDG_DATA_HOME:-~/.local/share}/hotkey-grammar-corrector/history.sqlite,
    resolved in one AppPaths type), "Time" (unix millis UTC from the Clock
    port; never DateTime.now() outside the clock adapter), "Logging"
    (structured lines to stderr through the one Logger port; NEVER log
    input_text or suggestion bodies), and "Enums in storage/config" (persist
    and serialize by .name, never by index).

    Note on AD ids: the breakdown request cited AD-14 for JsonConfigStore and
    AD-9 for SingleInstanceLock. Both are wrong against the spine. AD-13 is
    config ownership, AD-14 is the daemon singleton, AD-9 is the GlobalHotkey
    port. Use the spine's ids as written above.

    Deferred-work items this story closes (from
    _bmad-output/implementation-artifacts/deferred-work.md — retain each heading;
    when resolved, set `status: done <date>` and add a `resolution:` citing evidence):

    1. source_spec spec-register-tagged-stream-parser.md — "Truncation inside
    the final SHORTER line is indistinguishable from a clean no-trailing-newline
    end, so a cut-off response completes as success with partial text." The
    ledger states this is fixable only at the wire-format/prompt level or in the
    adapter contract, not in the parser. This story authors the shipped default
    preset's systemPrompt as a config default, so fix it there: require a
    trailing newline or an explicit end sentinel after the SHORTER line in the
    shipped prompt, and make RegisterTaggedStreamParser's contract documentation
    state which end-of-stream shapes are now trusted. Do not weaken the parser's
    existing tolerance without a test proving the new prompt guarantees it.

    2. source_spec spec-claude-agent-sdk-provider.md — "No wall-clock timeout on
    a correction — a sidecar whose network call stalls (no output, no EOF, no
    exit) hangs the stream until the user cancels, and
    CorrectionFailureKind.timeout remains unproduced; enforce it in the adapter
    when the config-store story supplies the timeout value." This IS the
    config-store story. Add the timeout as a config value with a default, and
    enforce it inside ClaudeAgentSdkCorrectionProvider so a stalled sidecar
    yields CorrectionFailed(timeout, ...) and the process GROUP is killed per
    AD-19 (SIGTERM then SIGKILL after a grace period — signalling only the
    Python PID orphans the claude CLI grandchild). Test the timeout path with a
    fake that never emits, not against a real sidecar.

    Everything here is headless-verifiable: unit tests over a temp directory and
    fake environment, no Flutter binding required. Update test/fakes/ where a
    port's contract changes.
