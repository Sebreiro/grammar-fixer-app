name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      - run: flutter pub get
      - run: dart analyze --fatal-infos

      # The X11 integration suite drives real key grabs on an isolated display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool g++ libglib2.0-dev dbus

      # Exercise the KDE activation-token method on a private session bus.
      - run: tool/test_native_panel_activation.sh

      # The fake CLI rows otherwise skip and give a misleading green result.
      - run: tool/provision_sidecar.sh

      # One Flutter run covers pure Dart, widget, composition, and integration
      # tests. dart_test.yaml keeps process-scoped socket suites serial.
      - run: rm -f coverage/lcov.info
      - run: flutter test --coverage --branch-coverage --exclude-tags=live test
      - run: dart run tool/check_coverage.dart coverage/lcov.info
